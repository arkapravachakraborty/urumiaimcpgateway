services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: mcpgateway-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pg_dev_data:
