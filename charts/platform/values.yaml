global:
  environment: local

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  existingSecret: postgres-secret
  persistence:
    storageClass: ""
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

gateway:
  image:
    repository: local/mcpgateway/gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 4000
  existingSecret: gateway-secret
  mcpSecret: mcp-auth-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

web:
  image:
    repository: local/mcpgateway/web
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

wooMcp:
  image:
    repository: local/mcpgateway/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3003
  existingSecret: woocommerce-api-secret
  mcpSecret: mcp-auth-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcpNotes:
  image:
    repository: local/mcpgateway/mcp-notes
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3001
  mcpSecret: mcp-auth-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcpUtils:
  image:
    repository: local/mcpgateway/mcp-utils
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3002
  mcpSecret: mcp-auth-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

dashboard:
  ingress:
    enabled: true
    className: traefik
    host: dashboard.localtest.me
    annotations: {}
    certManager:
      enabled: false
      clusterIssuer: letsencrypt-prod
    tls:
      enabled: false
      secretName: dashboard-tls

networkPolicy:
  enabled: true

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  database: wordpress
  user: wordpress
  existingSecret: mariadb-secret
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

wordpress:
  image:
    repository: wordpress
    tag: "6.7.2-apache"
    pullPolicy: IfNotPresent
  publicUrl: "http://shop.localtest.me:8080"
  title: "WooCommerce Demo Store"
  adminUser: "admin"
  adminEmail: "admin@localtest.me"
  existingSecret: wordpress-secret
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
  ingress:
    enabled: true
    className: traefik
    host: shop.localtest.me
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

setup:
  image:
    repository: wordpress
    tag: "cli-2.11.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  apiSecret: woocommerce-api-secret
  store:
    currency: USD
    product:
      name: "Sample Product"
      slug: "sample-product"
      price: "19.99"
      description: "A sample WooCommerce product created during store initialization."
