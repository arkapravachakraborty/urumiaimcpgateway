apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until node --input-type=commonjs -e "const socket=require('node:net').connect(5432,'postgres');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              node packages/db/node_modules/prisma/build/index.js migrate deploy --schema packages/db/prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: database-url
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["node", "apps/gateway/dist/index.js"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: GATEWAY_PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: database-url
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: encryption-key
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: session-secret
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: admin-password
            - name: MCP_WOO_URL
              value: http://woo-mcp:3003/mcp
            - name: MCP_NOTES_URL
              value: http://mcp-notes:3001/mcp
            - name: MCP_UTILS_URL
              value: http://mcp-utils:3002/mcp
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.mcpSecret }}
                  key: woo-token
            - name: MCP_NOTES_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.mcpSecret }}
                  key: notes-token
            - name: MCP_UTILS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.mcpSecret }}
                  key: utils-token
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: llm-provider
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: llm-model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: llm-api-key
                  optional: true
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: llm-base-url
                  optional: true
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: gateway
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: gateway
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
