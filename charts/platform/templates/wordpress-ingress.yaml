{{- if .Values.wordpress.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-store
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  {{- if .Values.wordpress.ingress.className }}
  ingressClassName: {{ .Values.wordpress.ingress.className | quote }}
  {{- end }}
  {{- if .Values.wordpress.ingress.tls }}
  tls:
    {{- toYaml .Values.wordpress.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.wordpress.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
{{- end }}
