apiVersion: v1
kind: Service
metadata:
  name: mcp-utils
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-utils
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mcpUtils.service.port }}
      targetPort: http
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-utils
