apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-notes
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-notes
spec:
  replicas: {{ .Values.mcpNotes.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-notes
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-notes
    spec:
      containers:
        - name: mcp-notes
          image: "{{ .Values.mcpNotes.image.repository }}:{{ .Values.mcpNotes.image.tag }}"
          imagePullPolicy: {{ .Values.mcpNotes.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpNotes.mcpSecret }}
                  key: notes-token
          resources:
            {{- toYaml .Values.mcpNotes.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: mcp-notes
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: mcp-notes
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
