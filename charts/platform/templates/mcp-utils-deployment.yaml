apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-utils
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-utils
spec:
  replicas: {{ .Values.mcpUtils.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-utils
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-utils
    spec:
      containers:
        - name: mcp-utils
          image: "{{ .Values.mcpUtils.image.repository }}:{{ .Values.mcpUtils.image.tag }}"
          imagePullPolicy: {{ .Values.mcpUtils.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpUtils.mcpSecret }}
                  key: utils-token
          resources:
            {{- toYaml .Values.mcpUtils.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: mcp-utils
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: mcp-utils
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
