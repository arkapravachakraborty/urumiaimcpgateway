apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.wooMcp.service.port }}
      targetPort: http
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
